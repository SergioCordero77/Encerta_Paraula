<!DOCTYPE html>
  <html lang="ca">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Joc d'encertar la paraula</title>

      <link rel="stylesheet" href="css/style.css">
      <script src="js/script.js" defer></script>
    </head>
    <body>

      <!-- Contenidor principal del joc -->
      <main id="main-content" class="container" aria-labelledby="main-title">

        <!-- Títol principal -->
        <h1 id="main-title">Joc d'encertar la paraula</h1>

        <!-- Avís sobre els camps obligatoris -->
        <p id="required-note" class="required-note">
          <span aria-hidden="true">*</span> Camp obligatori
        </p>

        <!-- Formulari de configuració de la partida -->
        <form id="game-form" aria-describedby="required-note">

          <!-- Selecció del nombre de jugadors -->
          <fieldset id="players-fieldset" class="radio-group">
            <h2>Nombre de jugadors</h2>

            <div>
              <label for="players-1">1 jugador</label>
              <input
                type="radio"
                id="players-1"
                name="jugadors"
                value="1"
                checked
              >
            </div>

            <div>
              <label for="players-2">2 jugadors</label>
              <input
                type="radio"
                id="players-2"
                name="jugadors"
                value="2"
              >
            </div>
          </fieldset>

          <!-- Secció d'introducció dels noms dels jugadors -->
          <section id="player-input-section" class="input-section"
            aria-labelledby="player-section-title">

            <h2 id="player-section-title">Dades dels jugadors</h2>

            <!-- Instruccions per introduir el nom -->
            

            <section class="input-section">
              
          <!-- Camp del nom del primer jugador -->
          <div id="player-1-row" class="input-row">
            <label for="player1">
              Introdueix el nom del jugador 1: <span class="asterisk">*</span>
            </label>

            <div class="input-container">
              <p id="player-name-help-1" class="help-text">
                Entre 4 i 14 caràcters: lletres, números i _
              </p>

              <input
                type="text"
                id="player1"
                name="player1"
                placeholder="Exemple: Anna_23"
                autocomplete="off"
                required
                aria-required="true"
                aria-describedby="player-name-help-1"
              />

              <span class="missatge-error" id="error-player1" aria-live="polite"></span>
            </div>
          </div>

          <!-- Camp del nom del segon jugador, inicialment ocult -->
          <div id="player-2-span" class="hide-item">
            <div id="player-2-row" class="input-row">
              <label for="player2">
                Introdueix el nom del jugador 2: <span class="asterisk">*</span>
              </label>

              <div class="input-container">
                <p id="player-name-help-2" class="help-text">
                  Entre 4 i 14 caràcters: lletres, números i _
                </p>

                <input
                  type="text"
                  id="player2"
                  name="player2"
                  placeholder="Exemple: Pau_07"
                  autocomplete="off"
                  aria-describedby="player-name-help-2"
                />

                <span class="missatge-error" id="error-player2" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </section>

          <!-- Secció de puntuació més alta -->
          <section id="high-score-section" aria-labelledby="high-score-title">
            <h2 id="high-score-title">Puntuació més alta</h2>

            <p id="high-score-value" class="info-text"></p>
          </section>

          <!-- Secció d'informació del navegador -->
          <section id="browser-section" aria-labelledby="browser-title">
            <h2 id="browser-title">Informació del navegador</h2>

            <p id="browser-value" class="info-text">
              <!-- El navegador es pot actualitzar mitjançant JavaScript -->
              Chrome
            </p>
          </section>

          <!-- Secció de l'idioma del joc -->
          <section id="language-section" aria-labelledby="language-title">
            <h2 id="language-title">Idioma del joc</h2>

            <p id="language-value" class="info-text" lang="ca"></p>
          </section>

          <!-- Secció d'informació de la URL -->
          <section id="url-section" aria-labelledby="url-title">
            <h2 id="url-title">Informació de la URL</h2>

            <p id="url-value" class="info-text"></p>
          </section>

          <!-- Zona per comunicar missatges d'estat als lectors de pantalla -->
          <p
            id="status-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>

          <!-- Zona per comunicar errors importants -->
          <p
            id="error-message"
            role="alert"
            aria-atomic="true"
          ></p>

          <!-- Botons d'acció de la partida -->
          <div id="game-actions" class="button-group">

            <input
              type="submit"
              id="start-game-button"
              aria-label="Començar una partida nova"
              value="Començar partida"
            >      
            </input>

            <button
              type="button"
              id="clear-score-button"
              aria-label="Esborrar la puntuació més alta desada"
            >
              Esborrar puntuació
            </button>

          </div>

        </form>
      </main>
    </body>
  </html>
