<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc Endevina Paraula</title>
    <link rel="stylesheet" href="css/styles-joc.css">
    <script src="js/script-joc.js" defer></script>
</head>
<body>

    <!-- Capçalera amb botons superiors i camp de cerca / paraula -->
    <header class="top-bar" role="banner">
        <button id="btn-tornar" class="btn btn-green" aria-label="Tornar a la pàgina anterior">&lt;&lt; Tornar</button>
        <button id="btn-instruccions" class="btn btn-green" aria-label="Mostrar instruccions del joc">Instruccions</button>
        
        <div class="input-container">
            <label for="input-paraula" id="idioma" class="label-idioma">Idioma (ca)</label>
            <div class="input-wrapper">
                <input type="password" id="input-paraula" placeholder="Introduceix una paraula" aria-label="Introduceix la paraula secreta">
                <button id="btn-veure-paraula" class="btn-eye" type="button" aria-label="Mostrar o ocultar paraula">👁️</button>
            </div>
        </div>

        <button id="btn-comencar" class="btn btn-green" aria-label="Començar la partida">Començar partida</button>
    </header>

    <main id="main-content" role="main">
        <!-- Banner del títol principal -->
        <section id="banner-main-title" class="banner-title" aria-label="Secció del títol">
            <h1 id="main-title">Començar    partida</h1>
        </section>

        <!-- Àrea principal del joc: Estadístiques i Imatge -->
        <section class="game-area" aria-label="Àrea de joc i puntuació">
            
            <!-- Targeta d'estadístiques del jugador -->
            <aside id="card-jugador" class="stats-card" aria-label="Estadístiques del jugador">
                <h2 id="nom-jugador" class="stats-header">jugador_33</h2>
                <div class="stats-body">
                    <p class="stat-label">PUNTS PARTIDES ACTUALS</p>
                    <p id="punts-actuals" class="stat-value">0</p>
                    
                    <p class="stat-label">TOTAL PARTIDES</p>
                    <p id="total-partides" class="stat-value">0</p>

                    <p class="stat-label">PARTIDES GUANYADES</p>
                    <p id="partides-guanyades" class="stat-value">0</p>

                    <p class="stat-label">PARTIDA AMB MÉS PUNTS:</p>
                    <p id="record-partida" class="stat-value"></p>
                </div>
            </aside>

            <!-- Marc central amb la imatge (ex. el globus / penjat) -->
            <figure id="container-imatge" class="image-box">
                <img id="img-globus" src="img/img_globus/img_0.png" alt="Número d'intents fallats: 0">
            </figure>

        </section>

        <!-- Teclat virtual inferior amb totes les lletres -->
        <nav id="teclat-lletres" class="keyboard" aria-label="Teclat de lletres"></nav>

        <dialog id="dialeg-error" class="dialeg-error">
            <h1 id="titol-error"></h1>
            <p id="missatge-error"></p>
            <button id="btn-tancar-error" type="button">Tancar</button>
        </dialog>
    </main>

</body>
</html>
